<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FC1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* FC1 (Football Civilian · Volume 1) — retro handheld look (single deliberate dark theme) */
:root {
  --ground: #0b1020;
  --panel: #141c33;
  --panel-2: #1b2544;
  --line: #2c3a63;
  --ink: #e9edf7;
  --ink-dim: #8e9bbd;
  --pitch: #4fd37f;
  --pitch-deep: #1f7a44;
  --gold: #f3c34f;
  --red: #ef5a68;
  --sky: #63b3ff;
  --shadow: #05080f;
  --font-pixel: 'Press Start 2P', 'Courier New', monospace;
  --font-mono: 'VT323', 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--font-mono); font-size: 21px; line-height: 1.25;
  padding-block: 12px; padding-inline: 16px;
  background-image: radial-gradient(circle at 50% -10%, #1a2750 0, transparent 60%);
}
a { color: var(--sky); }
#app { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  font-family: var(--font-pixel); font-size: 11px; letter-spacing: .04em; color: var(--pitch); text-transform: uppercase; }
.titlebar small { color: var(--ink-dim); font-size: 9px; }
.titlebar .rev { color: var(--gold); }
.titlebar .tb-right { display: flex; align-items: center; gap: 10px; }
.titlebar #snd { font-size: 16px; min-height: 32px; padding: 2px 8px; box-shadow: 3px 3px 0 var(--shadow); }
pre { margin: 0; font-family: var(--font-mono); white-space: pre; }
.ascii { font-size: clamp(11px, 3.1vw, 19px); line-height: 1.15; overflow-x: auto; color: var(--ink); }
.ascii .k { color: var(--ink-dim); }
.ascii .v { color: var(--gold); }
#dash { background: var(--panel); border: 3px solid var(--line); padding: 8px 10px; box-shadow: 6px 6px 0 var(--shadow); }
#dash:empty { display: none; }
#screen { background: var(--panel); border: 3px solid var(--line); padding: 14px 14px; box-shadow: 6px 6px 0 var(--shadow);
  min-height: 200px; display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { font-family: var(--font-pixel); text-wrap: balance; margin: 0; line-height: 1.6; }
h1 { font-size: 15px; color: var(--gold); }
h2 { font-size: 12px; color: var(--pitch); text-transform: uppercase; letter-spacing: .04em; }
h3 { font-size: 10px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .06em; }
p { margin: 0; max-width: 68ch; }
.muted { color: var(--ink-dim); }
.gold { color: var(--gold); } .green { color: var(--pitch); } .red { color: var(--red); } .sky { color: var(--sky); }
.script { display: flex; flex-direction: column; gap: 6px; }
.line { display: grid; grid-template-columns: 5.2em 1fr; gap: 8px; align-items: start; }
.line .who { font-family: var(--font-pixel); font-size: 9px; padding-top: 6px; letter-spacing: .04em; }
.line.john .who { color: var(--sky); } .line.ally .who { color: var(--gold); } .line.sys .who { color: var(--pitch); }
.line.min .who { color: var(--ink-dim); }
.line .what { border-left: 3px solid var(--line); padding-left: 10px; }
.line.goal .what { border-left-color: var(--pitch); color: var(--pitch); }
.line.bad .what { border-left-color: var(--red); }
.line.event .what { border-left-color: var(--gold); }
.card { background: var(--panel-2); border: 2px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.card.hl { border-color: var(--pitch); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.kv .k { color: var(--ink-dim); text-transform: uppercase; font-size: 17px; letter-spacing: .04em; }
.bar { display: grid; grid-template-columns: 7.5em 1fr 3em; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.bar .track { height: 14px; background: var(--ground); border: 2px solid var(--line); position: relative; }
.bar .fill { position: absolute; inset: 0; width: 0; background: repeating-linear-gradient(90deg, var(--pitch) 0 6px, var(--pitch-deep) 6px 8px); }
.bar.gold .fill { background: repeating-linear-gradient(90deg, var(--gold) 0 6px, #9a7a24 6px 8px); }
.bar.sky .fill { background: repeating-linear-gradient(90deg, var(--sky) 0 6px, #2d5c8f 6px 8px); }
.bar .lbl { text-transform: uppercase; font-size: 16px; letter-spacing: .04em; color: var(--ink-dim); }
#actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
#actions:empty { display: none; }
button, select, input {
  font-family: var(--font-mono); font-size: 20px; color: var(--ink); background: var(--panel-2);
  border: 3px solid var(--line); padding: 10px 12px; box-shadow: 4px 4px 0 var(--shadow); cursor: pointer;
  text-align: left; min-height: 48px;
}
button { transition: transform .05s; }
button:hover { border-color: var(--pitch); }
button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--shadow); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button.primary { border-color: var(--pitch); color: var(--pitch); }
button.warn { border-color: var(--gold); color: var(--gold); }
button.danger { border-color: var(--red); color: var(--red); }
button:disabled { opacity: .45; cursor: not-allowed; }
button .sub { display: block; font-size: 16px; color: var(--ink-dim); }
button.sm { min-height: 36px; padding: 4px 10px; font-size: 18px; }
input, select { width: 100%; cursor: text; }
select { cursor: pointer; }
label { display: flex; flex-direction: column; gap: 4px; font-family: var(--font-pixel); font-size: 9px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .06em; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.form .wide { grid-column: 1 / -1; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--font-pixel); font-size: 8px; color: var(--ink-dim); text-transform: uppercase; }
td.n, th.n { text-align: right; }
tr.me td { color: var(--pitch); background: rgba(79, 211, 127, .08); }
.pill { display: inline-block; font-family: var(--font-pixel); font-size: 8px; padding: 4px 6px; border: 2px solid var(--line); color: var(--ink-dim); text-transform: uppercase; }
.pill.ok { color: var(--pitch); border-color: var(--pitch); } .pill.gold { color: var(--gold); border-color: var(--gold); } .pill.red { color: var(--red); border-color: var(--red); }
.score { font-family: var(--font-pixel); font-size: 18px; color: var(--ink); text-align: center; padding: 8px; background: var(--ground); border: 2px solid var(--line); }
.score small { display: block; font-size: 9px; color: var(--ink-dim); margin-top: 6px; }
.log { display: flex; flex-direction: column; gap: 6px; max-height: 52vh; overflow-y: auto; padding-right: 4px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.notice { border: 2px dashed var(--gold); padding: 8px 12px; color: var(--gold); }
.blink { animation: blink 1s steps(2) infinite; }
@keyframes blink { to { visibility: hidden; } }
.garage pre { color: var(--sky); font-size: 18px; }
footer { color: var(--ink-dim); font-size: 16px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } button { transition: none; } }
@media (max-width: 480px) { body { font-size: 19px; } button, select, input { font-size: 18px; } #screen { padding: 10px; } }

/* ---- canvas scenes, joystick and buttons ---- */
.scene { position: relative; background: #0a2a14; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
.scene.fullscreen { position: fixed; inset: 0; z-index: 50; background: #000; }
body.has-scene { overflow: hidden; }
.arc-stage, .town-stage { position: absolute; inset: 0; }
.arc-stage canvas, .town-stage canvas { display: block; position: absolute; inset: 0; image-rendering: pixelated; }
.arc-hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 6px; background: rgba(5, 8, 15, .85); font-family: var(--font-pixel); font-size: 9px; color: var(--ink); z-index: 2; }
.arc-hud > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arc-exit { min-height: 30px; padding: 4px 8px; font-family: var(--font-pixel); font-size: 8px; box-shadow: none; border-width: 2px; }
.arc-log { position: absolute; left: 8px; right: 8px; top: calc(44px + env(safe-area-inset-top, 0px)); pointer-events: none; z-index: 1; gap: 2px; }
.arc-log .line { grid-template-columns: 3.6em 1fr; font-size: 15px; line-height: 1.1; text-shadow: 1px 1px 0 #000; opacity: .95; }
.arc-log .line .who { font-size: 7px; padding-top: 3px; } .arc-log .line .what { border-left-width: 2px; padding-left: 6px; }
.arc-log .line:nth-child(n+4) { display: none; }
.arc-hud .arc-clock { color: var(--gold); } .arc-hud .arc-rating { color: var(--pitch); }
.arc-ticker { position: absolute; top: calc(120px + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; font-size: 17px; color: #fff; text-shadow: 1px 1px 0 #000; padding: 4px 8px; pointer-events: none; }
.arc-ticker.flash { animation: tick 3s forwards; } @keyframes tick { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
.arc-banner { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-family: var(--font-pixel); font-size: 20px; color: var(--gold); text-shadow: 3px 3px 0 #000; pointer-events: none; }
.ctl { position: absolute; inset: 0; pointer-events: none; }
.ctl-stick { position: absolute; left: 0; bottom: 0; width: 55%; height: 55%; pointer-events: auto; }
.ctl-stick .ctl-hint { position: absolute; left: 12px; bottom: 10px; font-size: 14px; color: rgba(255,255,255,.55); }
.ctl-base { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 3px solid rgba(255,255,255,.55); background: rgba(0,0,0,.25); display: none; }
.ctl-base.on { display: block; }
.ctl-knob { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%; background: rgba(255,255,255,.85); }
.ctl-btns { position: absolute; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
.ctl-btn { width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(255,255,255,.8); background: rgba(0,0,0,.45); color: #fff; font-family: var(--font-pixel); font-size: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 3px 0 rgba(0,0,0,.6); padding: 0; min-height: 0; text-align: center; }
.ctl-btn small { font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,.7); }
.ctl-btn.on { background: var(--gold); color: #111; transform: translateY(2px); }
.ctl-shoot { border-color: #ff6b6b; } .ctl-pass { border-color: #63b3ff; } .ctl-skill { border-color: #4fd37f; margin-bottom: 40px; }
.ctl.kbd .ctl-stick, .ctl.kbd .ctl-btns { display: none; }
.ctl-legend { position: absolute; left: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 10px; font-size: 14px; color: rgba(255,255,255,.85); text-shadow: 1px 1px 0 #000; pointer-events: auto; align-items: center; }
.ctl-legend b { color: var(--gold); }
.ctl-toggle { min-height: 0; padding: 2px 6px; font-size: 13px; box-shadow: none; }
.town-prompt { position: absolute; top: calc(52px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--gold); color: #111; font-family: var(--font-pixel); font-size: 9px; padding: 8px 12px; cursor: pointer; }
.look { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: start; }
.look-canvas { background: var(--ground); border: 2px solid var(--line); width: 120px; height: 150px; image-rendering: pixelated; }
.look-traits { display: flex; flex-direction: column; gap: 6px; }
.look-row { display: grid; grid-template-columns: 6.5em 2.2em 1fr 2.2em; gap: 6px; align-items: center; }
.look-row .lbl { color: var(--ink-dim); text-transform: uppercase; font-size: 15px; letter-spacing: .04em; }
.look-row .sm { min-height: 32px; padding: 2px 6px; text-align: center; }
.look-val { text-align: center; }
@media (max-width: 480px) { .look { grid-template-columns: 1fr; } .ctl-btn { width: 64px; height: 64px; } }
.choices.diff { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.choices.diff .sm { text-align: center; }
.town-note { top: auto; bottom: 30%; font-size: 11px; color: #fff; background: rgba(5,8,15,.8); margin: 0 16px; padding: 10px 12px; line-height: 1.6; }
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; background: var(--panel-2); border: 2px solid var(--line); padding: 10px 12px; }
.item.cur { border-color: var(--pitch); }
.item-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item-main .fx { font-size: 17px; color: var(--ink-dim); }
.item-act { display: flex; align-items: center; }
.item-act .sm { white-space: nowrap; min-width: 9em; text-align: center; }
.item-act .sm .sub { font-size: 14px; text-align: center; }
@media (max-width: 560px) { .item { grid-template-columns: 1fr; } .item-act .sm { width: 100%; } }
.shoptabs { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.item-act { gap: 8px; flex-wrap: wrap; }
.cut-stage { position: absolute; inset: 0; background: #05070c; }
.cut-stage canvas { position: absolute; inset: 0; display: block; image-rendering: pixelated; }
.cut-caption { position: absolute; left: 12px; right: 12px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: rgba(5, 8, 15, .9); border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--shadow); padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.cut-caption .who { font-family: var(--font-pixel); font-size: 9px; color: var(--gold); padding-top: 5px; text-transform: uppercase; }
.cut-caption .what { font-size: 20px; line-height: 1.2; color: var(--ink); }
.cut-banner { top: 12%; font-size: 22px; } .cut-banner small { display: block; font-size: 10px; color: var(--ink); margin-top: 8px; }
.cut-skip { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; min-height: 32px; padding: 4px 10px; font-family: var(--font-pixel); font-size: 8px; box-shadow: none; border-width: 2px; background: rgba(5,8,15,.8); }

.kv .ok { color: var(--pitch); } .kv .bad { color: var(--red); }

.tip { border-style: dashed; }
.guide-t { width: 100%; box-shadow: none; border-width: 2px; }
.guide-body { display: flex; flex-direction: column; gap: 8px; padding: 8px 4px 2px; }
.guide-body p { max-width: none; }
</style></head><body>

  const poisson = lambda => { const L = Math.exp(-lambda); let k = 0, p = 1; do { k++; p *= rnd(); } while (p > L); return k - 1; };

  const ATTRS = ['pac', 'sho', 'pas', 'dri', 'def', 'phy'];
  function calcOVR(attrs, pos) {
    const w = D.POSITIONS[pos].w;
    let s = 0; for (const a of ATTRS) s += attrs[a] * w[a];
    return Math.round(s);
  }
  // Generate attributes near a target OVR for a position
  function genAttrs(pos, target) {
    const w = D.POSITIONS[pos].w;
    const attrs = {};
    for (const a of ATTRS) {
      const emphasis = (w[a] - 0.1667) * 60; // + for key attrs, - for weak
      attrs[a] = clamp(Math.round(target + emphasis + ri(-6, 6)), 20, 95);
    }
    // nudge to hit target
    for (let i = 0; i < 30; i++) {
      const o = calcOVR(attrs, pos);
      if (o === target) break;
      const a = pick(ATTRS);

    return 'phy';

  // ---------- Fixtures & tables ----------
  function roundRobin(n) {
    const ids = []; for (let i = 0; i < n; i++) ids.push(i);
    if (n % 2) ids.push(-1);
    const m = ids.length, rounds = [];
    for (let r = 0; r < m - 1; r++) {
      const pairs = [];
      for (let i = 0; i < m / 2; i++) {
        const a = ids[i], b = ids[m - 1 - i];
        if (a >= 0 && b >= 0) pairs.push(r % 2 ? [a, b] : [b, a]);
      }
      rounds.push(pairs);
      ids.splice(1, 0, ids.pop());
    }
    const second = rounds.map(ps => ps.map(([h, a]) => [a, h]));
    return shuffle(rounds).concat(shuffle(second));
  }
  function freshLeague(def) {
    const clubs = def.teams.map(([name, str], i) => ({ id: def.id + i, name, str, league: def.id }));
    return { id: def.id, name: def.name, country: def.country, tier: def.tier, wageMult: def.wageMult,
      clubs, rounds: roundRobin(clubs.length), round: 0,
      table: clubs.map(() => ({ p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 })) };
  }
  function newWorld() { return D.LEAGUES.map(freshLeague); }
  function resetSeason(world) { world.forEach(lg => { const f = freshLeague(D.LEAGUES.find(d => d.id === lg.id)); lg.rounds = f.rounds; lg.round = 0; lg.table = f.table; }); }
  function xgFor(strH, strA) {
    const diff = strH - strA;
    return [1.25 * Math.exp(diff * 0.022) + 0.15, 1.25 * Math.exp(-diff * 0.022)];
  }
  function simScore(strH, strA) { const [xh, xa] = xgFor(strH, strA); return [poisson(xh), poisson(xa)]; }
  function applyResult(lg, h, a, gh, ga) {
    const H = lg.table[h], A = lg.table[a];
    H.p++; A.p++; H.gf += gh; H.ga += ga; A.gf += ga; A.ga += gh;
    if (gh > ga) { H.w++; A.l++; H.pts += 3; } else if (gh < ga) { A.w++; H.l++; A.pts += 3; } else { H.d++; A.d++; H.pts++; A.pts++; }
  }
  function standings(lg) {
    return lg.clubs.map((c, i) => Object.assign({ club: c, idx: i }, lg.table[i]))
      .sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || x.club.name.localeCompare(y.club.name));
  }
  function nextFixtureFor(lg, clubIdx) {
    if (lg.round >= lg.rounds.length) return null;
    const pair = lg.rounds[lg.round].find(([h, a]) => h === clubIdx || a === clubIdx);
    if (!pair) return null;
    return { home: pair[0], away: pair[1], isHome: pair[0] === clubIdx, opp: pair[0] === clubIdx ? pair[1] : pair[0] };
  }
  // Advance every league one round; the player's fixture uses the supplied score
  function advanceWeek(world, playerLeagueId, playerClubIdx, playerScore) {
    const results = [];
    for (const lg of world) {
      if (lg.round >= lg.rounds.length) continue;
      for (const [h, a] of lg.rounds[lg.round]) {
        let gh, ga;
        if (lg.id === playerLeagueId && (h === playerClubIdx || a === playerClubIdx) && playerScore) {
          [gh, ga] = playerScore;
        } else [gh, ga] = simScore(lg.clubs[h].str, lg.clubs[a].str);
        applyResult(lg, h, a, gh, ga);
        if (lg.id === playerLeagueId) results.push({ h: lg.clubs[h].name, a: lg.clubs[a].name, gh, ga });
      }
      lg.round++;
    }
    return results;
  }

  function successProb(attrVal, diff, teamDiff, formAvg) {
    let p = 0.5 + (attrVal - diff) * 0.010 + teamDiff * 0.006 + ((formAvg || 6) - 6) * 0.03;
    return clamp(p, 0.08, 0.92);
  }

  // Build the moments for a match: how often the ball finds the player scales with chemistry (up to 3x)
  function buildMatch(state, mode) {
    const p = state.player, club = currentClub(state), lg = currentLeague(state);
    const fx = nextFixtureFor(lg, state.clubIdx);
    const opp = lg.clubs[fx.opp];
    const group = D.POSITIONS[p.pos].group;
    const starts = p.coach >= 35;
    const unused = p.coach < 15;
    let n = mode === 'highlights' ? 1 + Math.floor(p.chem / 50) : 2 + Math.floor(p.chem / 34);
    if (!starts) n = Math.max(1, Math.round(n / 2));
    if (unused) n = 0;
    const templates = shuffle(T[group]);
    const moments = [];
    const from = starts ? 3 : 62;
    for (let i = 0; i < n; i++) {
      const tpl = templates[i % templates.length];
      const minute = clamp(Math.round(from + (i + 0.5) * (88 - from) / n + ri(-4, 4)), from, 90);
      moments.push({ minute, tpl, mate: pick(state.teammates) });
    }
    moments.sort((a, b) => a.minute - b.minute);
    // background goals
    const myStr = club.str + (p.ovr - club.str) * 0.06;
    let [xh, xa] = fx.isHome ? xgFor(myStr, opp.str) : xgFor(opp.str, myStr);
    let xMine = fx.isHome ? xh : xa, xTheirs = fx.isHome ? xa : xh;
    if (group === 'ATT') xMine = Math.max(0.3, xMine - 0.22 * n);
    if (group === 'MID') xMine = Math.max(0.4, xMine - 0.08 * n);
    if (group === 'DEF') xTheirs = Math.max(0.3, xTheirs - 0.12 * n);
    if (group === 'GK') xTheirs = Math.max(0.3, xTheirs - 0.16 * n);
    const bg = [];
    for (let i = 0; i < poisson(xMine); i++) bg.push({ minute: ri(2, 90), side: 'us', scorer: pick(state.teammates) });
    for (let i = 0; i < poisson(xTheirs); i++) bg.push({ minute: ri(2, 90), side: 'them' });
    bg.sort((a, b) => a.minute - b.minute);
    return { fx, opp, club, moments, bg, starts, unused, teamDiff: myStr - opp.str, mode,
      score: [0, 0], rating: 6.0, goals: 0, assists: 0, saves: 0, keys: 0, log: [], done: false, i: 0 };
  }

  function resolveMoment(state, m, moment, optIdx) {
    const p = state.player;
    const opt = moment.tpl.opts[optIdx];
    let pr = successProb(p.attrs[opt.attr], opt.diff, m.teamDiff, formAvg(p));
    if (opt.guess) pr = 0.34 + (p.attrs[opt.attr] - 50) * 0.003; // penalty guessing
    const ok = rnd() < pr;
    const out = ok ? opt.ok : opt.bad;
    const res = { ok, type: out.type, txt: out.txt, r: out.r, concede: false, goal: false, assist: false, attr: opt.attr, prob: pr };
    m.rating = clamp(m.rating + out.r, 2, 10);
    if (ok) {
      if (out.type === 'goal') { m.goals++; m.score[0]++; res.goal = true; }
      if (out.type === 'assist') { m.assists++; m.score[0]++; res.assist = true; }
      if (out.type === 'save') m.saves++;
      if (out.type === 'key') m.keys++;

<script>/* ===== app.js ===== */
/* FC1 (Football Civilian · Volume 1) — UI & flow */
(function () {

  // ---------- tutorials: a guide screen and one-time tip cards ----------
  const GUIDE = [
    { id: 'match', icon: '⚽', title: 'Matches and controls', body: `<p>Move with the joystick (phone) or WASD / arrows (computer). <b>SHOOT</b> (Space): tap for a low shot, hold for power. <b>PASS</b> (P): pass with the ball, or press it <i>without</i> the ball to call for it. <b>SKILL</b> (Z): sprint with the ball, slide tackle without it, dive as a keeper.</p><p>Shots from inside the box go in about a third of the time at Amateur. Long shots rarely do. Your teammates push forward when you attack: look for the overlap down the wing and the runner ahead of you.</p><p>Mistimed slides are fouls. Yellow cards cost coach popularity, a red bans you for a match. Sprinting drains stamina, and tired players slow down.</p><p>Your rating comes from goals, assists, shots on target, completed passes and tackles won. Keep it above 7.0 and the coach, the fans and the money follow.</p>` },
    { id: 'modes', icon: '🏟', title: 'Match day modes', body: `<p><b>Full Match</b> is two halves of 150 seconds on the pitch. <b>Highlights</b> is the same but shorter. <b>Sim</b> plays a text match with a few choices. <b>Quick Sim</b> settles it instantly.</p><p>Pick a difficulty before kick-off. It changes the opposition only: their speed, tackling, shooting and keeper. Harder levels add a small bonus to your rating.</p><p>Coach popularity under 35 puts you on the bench, under 15 out of the squad. A rival in your position can take your shirt if he outperforms you.</p>` },
    { id: 'charm', icon: '✨', title: 'Charm', body: `<p>Charm is how you come across off the pitch. It tilts transfer offers toward bigger clubs, sets your odds on the dating app, and is one of the two keys to the City Hall registrar.</p><p>Raise it with outfits, accessories and the barber in the Shopping Center, press conferences at the stadium, and tasteful social media posts. Winning matches adds a little too.</p>` },
    { id: 'fame', icon: '🌟', title: 'Fame and fans', body: `<p><b>Fame</b> is how widely you are known. Goals, man of the match awards, derbies, internationals and trophies raise it. Fame unlocks the press room (10), the megastore (30), an international call-up (12 plus the OVR threshold), brand deals (25, 45, 65, 85) and fan crowds in town (50).</p><p><b>Fans</b> are how much your own supporters love you. Posts, autographs, buying your own shirt and good performances raise it. Slipping away from fans or a bad post lowers it.</p>` },
    { id: 'coach', icon: '📋', title: 'Coach, chemistry and energy', body: `<p><b>Coach</b> decides if you start. Train, visit the coach's office, play well, avoid cards. Under 35 you are a substitute.</p><p><b>Chemistry</b> is how much the squad looks for you. It rises with games together and training, and scales how often you get passed to.</p><p><b>Energy</b> is spent on training sessions and mini games. Sleep, the sofa, the fridge, coffee and the physio top it up once a week each. Fitness gear raises the ceiling.</p>` },
    { id: 'home', icon: '🏠', title: 'Your house', body: `<p>Downstairs: TV for league tables, the sofa for a nap or a movie night with a partner who lives with you, the trophy cabinet for your career, the fridge for a snack, the garage for your cars. Upstairs: bed for a proper sleep, your phone, the mirror for your look, and the balcony.</p><p>Bigger houses come from the estate agent in the Shopping Center. You need a real home, not the academy digs, before a partner can move in.</p>` },
    { id: 'shop', icon: '🛍', title: 'Shopping Center', body: `<p><b>Boots</b> add attributes. <b>Outfits</b> and <b>accessories</b> add Charm and change how you look in town. <b>Kits</b> are worn around town. <b>Fitness gear</b> raises your energy ceiling and training odds. <b>Gifts</b> are for your partner, including the engagement ring.</p><p>Upstairs: fitness gear, the car showroom, the estate agent and the barber. The café downstairs sells coffee for energy and has the date table.</p>` },
    { id: 'train', icon: '🏃', title: 'Training', body: `<p>Each session costs energy for a chance at +1 to an attribute. The pitch menu lets you pick what to work on. The gym is a timing mini game with better odds: press ENTER when the marker is in the green. The park kickabout in town is a cheaper version.</p><p>Position matters: a striker gains most from shooting and pace, a centre-back from defending and physical.</p>` },
    { id: 'money', icon: '💰', title: 'Money, contracts and transfers', body: `<p>Your wage lands weekly. Sponsors and brand deals add to it. Every 20 weeks the transfer window opens with up to three offers based on OVR, form and Charm. A transfer request through the manager or your agent brings more offers. Signing a deal plays the contract cutscene.</p>` },
    { id: 'agent', icon: '🕴', title: 'Agent, quests and sponsors', body: `<p>The agent's office in town offers quests (score three in four games, keep two clean sheets, and so on) with cash and fame rewards, plus sponsor deals that pay weekly. Check in after a good run of form.</p>` },
    { id: 'life', icon: '📱', title: 'Phone, dating and family', body: `<p>The phone is upstairs at home or in the quick menu. <b>Social</b>: post once a week for fans and fame, and sign brand deals when they come in. <b>Dating</b>: three people a week, odds set by Charm and Fame. Keep in touch every week or love fades. Gifts, café dates and movie nights build it.</p><p>Move in after eight weeks with love 60. Propose with a ring at love 85, or marry at City Hall with Charm 40 and Fame 25. Married couples can start a family.</p>` },
    { id: 'cityhall', icon: '🏛', title: 'City Hall', body: `<p>The registrar marries you and your partner for $500 if you have Charm 40 and Fame 25 and love is at least 40. No ring needed. The queue has three people a week with their details: pick one and ask them out. It is a straight 50/50.</p>` },

    { id: 'end', icon: '🏆', title: 'Season end and retirement', body: `<p>At the end of each season: a highlights reel of your goals, a trophy lift if you won the league, and the awards gala. From 31 your pace drops each year. Retire from 34 for a lap of honour and a place in the Hall of Fame on the menu.</p>` },

  function natKit(n) { const c = NAT_KIT[n] || NAT_KIT2[n] || ['#ffffff', '#222222']; return { shirt: c[0], shorts: c[1], pattern: 'plain' }; }
  function callUpThreshold() { return (NATIONS[P().nat] || 78) - 18; }

  // Special (non-league) match consequences: no league week is consumed
  function finishSpecial(m, res) {
    const p = P(); const r = res.played ? E.clamp(res.rating, 2, 10) : null; const win = res.score[0] > res.score[1], draw = res.score[0] === res.score[1];
    p.caps = (p.caps || 0) + 1; p.intGoals = (p.intGoals || 0) + res.goals;

    p.fame = E.clamp(p.fame + fame, 0, 100); p.fans = E.clamp(p.fans + Math.round(fame * 0.6), 0, 100); p.charm = E.clamp(p.charm + (win ? 1 : 0), 0, 100);

    const nm = esc(pname());
    let html = `<h2>Regional Academy Final · 90+5'</h2>
      <div class="score">RIVERSIDE ACADEMY 1 — 1 HARBOUR TOWN U18<small>90+5' · PENALTY TO RIVERSIDE</small></div>
      <div class="script">
        ${scriptLine('John', `Five seconds left on the clock. Level at one apiece. And it is <b>${esc(p.name)}</b> who picks up the ball.`)}
        ${scriptLine('Ally', `Sixteen years old, John. Whole academy watching. Scouts in the main stand with their notebooks out. This is the moment.`)}
        ${pen.log.map(l => l).join('')}
      </div>`;
    const actions = [];
    if (pen.state === 'scored') {
      html += `<div class="notice">GOAL! Riverside win the final ${pen.attempts > 1 ? `(after ${pen.attempts} attempts... the engine is generous, the keeper was not)` : 'at the first time of asking'}.</div>`;
      actions.push({ label: '▶ Continue: the tunnel', cls: 'primary', fn: () => setPhase('scout') });
    } else if (pen.state === 'failed') {
      html += `<div class="notice">⏪ REWIND AVAILABLE — the engine winds the clock back to 90+5.</div>`;
      actions.push({ label: '⏪ Rewind and re-take', cls: 'warn', fn: () => { pen.state = null; if (A) A.sfx('rewind'); pen.log.push(scriptLine('SYS', '<span class="blink">⏪⏪⏪</span> The tape rewinds. The ball is back on the spot. Nobody remembers a thing.', 'event', 'penr' + pen.attempts)); render(); } });
    } else {
      html += `<h3>Pick your spot</h3>`;
      E.PEN_DIRS.forEach(dir => actions.push({ label: dir === 'Panenka' ? '🪶 Panenka' : `🎯 ${dir}`, fn: () => {
        pen.attempts++;
        const r = E.takePenalty(dir, p.attrs.sho);
        pen.log.push(scriptLine('John', `${nm} runs up... goes <b>${esc(dir)}</b>. Keeper goes ${esc(r.keeper.toLowerCase())}...`, 'event', 'pen' + pen.attempts + 'a'));
        if (r.result === 'goal') {
          pen.state = 'scored';
          pen.log.push(scriptLine('Ally', dir === 'Panenka' ? 'A PANENKA! In a final! At SIXTEEN! I need to sit down and I am already sitting down!' : 'GOOOAAAL! In it goes! The academy bench is on the pitch!', 'goal', 'pen' + pen.attempts + 'b'));
          pen.log.push(scriptLine('John', `${esc(p.name)}${pr(p)} wins it in the 95th minute! Remember the name.`, 'goal', 'pen' + pen.attempts + 'c'));
          if (A) A.sfx('goal');
          p.fame = 3; p.fans = 10;
        } else {
          pen.state = 'failed';
          pen.log.push(scriptLine('Ally', r.result === 'saved' ? 'SAVED! Oh no. Oh no no no. The keeper guessed right.' : 'OVER THE BAR! Into the car park! Somebody\'s windscreen is done.', 'bad', 'pen' + pen.attempts + 'b'));
          pen.log.push(scriptLine('John', '<i>(groans)</i> That is a heavy, heavy moment for a sixteen-year-old.', 'bad', 'pen' + pen.attempts + 'c'));
          if (A) A.sfx('bad');
        }
        render();
      } }));
    }
    return { html, actions };
  };

  VIEWS.scout = () => {
    if (!U.offers) U.offers = E.startingOffers(S);
    const p = P();
    const cards = U.offers.map((o, i) => `<div class="card ${i === 0 ? 'hl' : ''}"><h3>${esc(o.leagueName)}</h3><div class="gold">${esc(o.clubName)}</div>
      <div class="kv"><span class="k">Club str</span><span>${o.str}</span><span class="k">Wage</span><span>${money(o.wage)}/wk</span><span class="k">Length</span><span>${o.weeks} weeks</span><span class="k">Role</span><span>${esc(o.role)}</span></div>
      <p class="muted">${esc(o.promise)}</p></div>`).join('');
    const html = `<h2>The tunnel · Full time</h2>
      <div class="script">
        ${scriptLine('SYS', 'Mud on your knees, medal round your neck. A man in a grey club raincoat steps out of the shadow by the physio room. Then another. Then a third, holding a phone with a very bad photo of you on it.')}
        ${scriptLine('Scout', `"${esc(pname())}, is it? I saw the penalty. I also saw the forty minutes before it, which is what actually matters. We run the academy at a professional club. Lower tier, honest wages, first-team training. Nobody's promising you the moon."`)}
        ${scriptLine('Ally', '<i>(from the gantry, muffled)</i> Three clubs, John. THREE. I told you.')}
      </div>
      <div class="cards">${cards}</div>`;
    const actions = U.offers.map(o => ({ label: `✍ Sign for ${esc(o.clubName)}`, cls: 'primary', sub: `${esc(o.leagueName)} · ${money(o.wage)}/wk`, fn: () => {
      E.acceptOffer(S, o); U.offers = null; S.phase = 'hub'; U.welcome = true; save();
      playCut('contract', cutData({ money: money(o.wage), weeks: o.weeks, role: o.role }), () => { U.screen = 'hub'; render(); });
    } }));
    return { html, actions };
  };

  // ---- PHASE 3: hub ----
  function fixtureCard() {
    const fx = E.nextFixtureFor(lg(), S.clubIdx);
    if (!fx) return lg().round < lg().rounds.length ? `<div class="card"><h3>Bye week · Week ${S.week}</h3><p>No fixture for ${esc(club().name)} this round. Train, shop, then rest at the stadium to move the week on.</p></div>` : `<div class="card"><h3>Season complete</h3><p>Head to the stadium to close the season.</p></div>`;
    const opp = lg().clubs[fx.opp];
    const st = E.standings(lg()); const myPos = st.findIndex(r => r.idx === S.clubIdx) + 1, opPos = st.findIndex(r => r.idx === fx.opp) + 1;
    return `<div class="card hl"><h3>Next fixture · Week ${S.week} · Round ${lg().round + 1}/${lg().rounds.length}</h3>
      <div class="row"><span class="gold">${esc(club().name)}</span><span class="muted">(${myPos}${ord(myPos)}, str ${club().str})</span><span>${fx.isHome ? 'vs' : '@'}</span><span class="sky">${esc(opp.name)}</span><span class="muted">(${opPos}${ord(opPos)}, str ${opp.str})</span></div>
      <div>${starts() ? '<span class="pill ok">Starting XI</span>' : P().coach < 15 ? '<span class="pill red">Not in squad</span>' : '<span class="pill gold">On the bench</span>'} <span class="muted">Coach popularity ${P().coach}: ${starts() ? 'you start.' : P().coach < 15 ? 'you are not in the matchday squad. Train and behave.' : 'you come on around the hour mark.'}</span></div></div>`;
  }
  const ord = n => (n % 10 === 1 && n % 100 !== 11) ? 'st' : (n % 10 === 2 && n % 100 !== 12) ? 'nd' : (n % 10 === 3 && n % 100 !== 13) ? 'rd' : 'th';

  // ---------- open-world actions and weekly perks ----------
  const energySub = () => `energy ${Math.round(P().energy)}/${E.maxEnergy(S)} · $${Math.round(P().money).toLocaleString('en-US')}`;
  function perkOnce(id) { S.flags.perks = S.flags.perks && S.flags.perks.week === S.week ? S.flags.perks : { week: S.week, used: {} }; if (S.flags.perks.used[id]) return false; S.flags.perks.used[id] = true; return true; }
  function gainEnergy(n) { const p = P(); const before = p.energy; p.energy = Math.min(E.maxEnergy(S), p.energy + n); return Math.round(p.energy - before); }
  const PERKS = {
    nap: () => perkOnce('nap') ? `Twenty minutes on the sofa. Energy +${gainEnergy(10)}.` : 'You already napped this week. The sofa judges you.',
    sofa: () => { const L = life(); if (L.partner && L.livesTogether) { if (!perkOnce('sofa')) return 'You have had your evening in this week.'; L.love = E.clamp(L.love + 8, 0, 100); L.lastContact = S.week; return `Movie night with ${L.partner.name}. Love +8, Energy +${gainEnergy(10)}.`; } return PERKS.nap(); },
    date: () => { const L = life(); const p = P(); if (!L.partner) return 'Nobody to take. Check the dating tab on your phone.'; if (p.money < 60) return 'Dinner is $60. You are short.'; if (!perkOnce('date')) return 'One date night a week. Keep them keen.'; p.money -= 60; const bonus = L.partner.trait === 'foodie' ? 5 : 0; L.love = E.clamp(L.love + 10 + bonus, 0, 100); L.lastContact = S.week; return `Dinner with ${L.partner.name}. Love +${10 + bonus}.${bonus ? ' They loved the food.' : ''}`; },
    megastore: () => { const p = P(); if (p.fame < 30) return `Your shirt is not on sale yet. Fame 30 needed (you have ${p.fame}).`; if (S.flags.megaSeason === p.seasons) return 'You already bought your own shirt this season. That is enough.'; if (p.money < 80) return 'Replica shirt: $80. You are short.'; S.flags.megaSeason = p.seasons; p.money -= 80; p.fans = E.clamp(p.fans + 5, 0, 100); p.charm = E.clamp(p.charm + 1, 0, 100); return 'You bought your own shirt. A kid asked you to sign it. Fans +5, Charm +1.'; },
    sleep: () => perkOnce('sleep') ? `A proper night's sleep. Energy +${gainEnergy(15)}.` : 'You have slept enough this week. Go and train.',
    snack: () => perkOnce('snack') ? `Leftover pasta, cold, standing up. Energy +${gainEnergy(6)}.` : 'The fridge is empty. Shopping Center is across the road.',
    coffee: () => { const p = P(); if (p.money < 25) return 'Coffee is $25. You are $' + (25 - Math.round(p.money)) + ' short.'; if (!perkOnce('coffee')) return 'The barista cuts you off. One a week, athlete.'; p.money -= 25; return `Flat white. $25. Energy +${gainEnergy(6)}.`; },
    physio: () => { const p = P(); if (p.injury > 0) { if (!perkOnce('physio')) return 'Treatment done for this week. Rest.'; p.injury--; return p.injury > 0 ? `Treatment. ${p.injury} week${p.injury > 1 ? 's' : ''} of the injury left.` : 'Treatment. You are cleared to play.'; } return perkOnce('physio') ? `Ice bath and a rub down. Energy +${gainEnergy(10)}.` : 'Physio has seen you already this week.'; },
    coach: () => { const p = P(); if (!perkOnce('coach')) return 'The coach waves you out. "Show me on the pitch."'; p.coach = E.clamp(p.coach + 2, 0, 100); return p.coach >= 60 ? '"Keep doing what you are doing." Coach +2.' : p.coach >= 35 ? '"Work harder in training and you will start." Coach +2.' : '"You are not close to the team yet. Train." Coach +2.'; },
    press: () => { const p = P(); if (p.fame < 10) return 'Two journalists and a work-experience kid. Nobody asks a question.'; if (!perkOnce('press')) return 'The press officer says you have done enough talking this week.'; p.fame = E.clamp(p.fame + 1, 0, 100); p.charm = E.clamp(p.charm + 1, 0, 100); return 'You handle the questions well. Fame +1, Charm +1.'; },
    notices: () => { const p = P(); const L = life(); const st = E.standings(lg()); const pos = st.findIndex(r => r.idx === S.clubIdx) + 1; return p.fame < 10 ? 'Planning notices, a lost cat, and nothing about you yet.' : `"${club().name} sit ${pos}${ord(pos)}." A clipping about you is pinned up${L.status === 'married' ? ', next to your wedding notice' : ''}. Fame ${p.fame}.`; },
    bench: () => { const L = life(); return L.status === 'single' ? 'You sit. The queue shuffles forward. Somebody glances over twice.' : `You sit and think about ${L.partner.name}. Love ${L.love}.`; },
    balcony: () => { const p = P(); const st = E.standings(lg()); const pos = st.findIndex(r => r.idx === S.clubIdx) + 1; return `Floodlights on the horizon. ${club().name} sit ${pos}${ord(pos)}. Fame ${p.fame}, fans ${p.fans}.`; },
  };
  function worldAction(action) {
    const p = P();
    if (action.startsWith('open:')) {
      const [, screen, tab] = action.split(':');
      if (screen === 'shop') { U.shopTab = tab || 'boots'; go('shop'); }
      else if (screen === 'talk') { U.talkReply = null; U.talkPos = false; go('talk'); }
      else if (screen === 'life') { U.lifeTab = 'social'; go('life'); }
      else if (screen === 'cityhall') { U.hallTab = tab || 'registrar'; U.lifeNote = null; go('cityhall'); }
      else if (screen === 'agent') go('agent');
      else if (screen === 'garage' || screen === 'contract' || screen === 'estate' || screen === 'mirror') { U.homeFocus = screen; go('home'); }
      else go(screen);
      return;
    }
    if (action.startsWith('perk:')) { const f = PERKS[action.slice(5)]; if (f) { U.town.note(f()); U.town.setSub(energySub()); save(); } return; }
    if (action.startsWith('mini:')) {
      const kind = action.slice(5); const cost = kind === 'gym' ? E.TRAIN_COST : 20;
      if (p.injury > 0) { U.town.note('Injured. See the physio first.'); return; }
      if (p.energy < cost) { U.town.note(`Not enough energy (${cost} needed).`); return; }
      U.town.startMini({ title: kind === 'gym' ? 'Gym session' : 'Keepy-uppies', reps: 5, speed: kind === 'gym' ? 1.5 : 1.9 }, (hits, reps) => {
        p.energy -= cost; if (kind === 'gym') S.trainedThisWeek = true;
        const chance = (kind === 'gym' ? 0.3 : 0.15) + (hits / reps) * (kind === 'gym' ? 0.5 : 0.35) + E.trainBonus(S) / 150;
        if (Math.random() < chance) { const at = kind === 'gym' ? E.weightedAttr(p.pos) : E.pick(E.ATTRS); p.attrs[at] = E.clamp(p.attrs[at] + 1, 20, 99); p.ovr = E.calcOVR(p.attrs, p.pos); U.town.note(`${hits}/${reps} clean. +1 ${attrLabel(at)}! OVR ${p.ovr}.`); }
        else U.town.note(`${hits}/${reps} clean. No gain this time (${Math.round(chance * 100)}% chance).`);
        if (kind === 'gym') p.coach = E.clamp(p.coach + 1, 0, 100);
        U.town.setSub(energySub()); save(); });
      return;
    }
    if (action === 'bus') { U.town.note('The number 9 to the stadium. Free with a season ticket.'); U.town.goto('stadium', 180, 60); return; }
    if (action === 'kickabout') {
      if (p.energy < 20) { U.town.note('Too tired for a kickabout. Energy 20 needed.'); return; }
      p.energy -= 20; let msg = 'Jumpers for goalposts. A kid nutmegs you. No gain today.';
      if (Math.random() < 0.3) { const at = E.pick(E.ATTRS); p.attrs[at] = E.clamp(p.attrs[at] + 1, 20, 99); p.ovr = E.calcOVR(p.attrs, p.pos); msg = `Jumpers for goalposts. +1 ${attrLabel(at)}! OVR ${p.ovr}.`; }
      U.town.note(msg); U.town.setSub(energySub()); save(); return;
    }
  }

  function maybeFanEncounter(place) {
    const p = P();
    if (U.forceFan) { U.forceFan = false; }
    else if (p.fame < 50 || S.flags.fanWeek === S.week || Math.random() > 0.4 || place === 'hub') return '';
    S.flags.fanWeek = S.week;
    U.fan = { place };
    return `<div class="card hl" id="fan"><h3>You've been spotted</h3><p>${place === 'shop' ? 'A group of teenagers outside the sportswear shop do a double take. Phones come out. Within thirty seconds there is a small crowd chanting your name at the escalator.' : place === 'home' ? 'Two kids on bikes have been waiting by the gate for an hour. One is wearing your shirt. The name is spelt wrong.' : 'A steward at the training ground asks, sheepishly, if you would sign a programme for his daughter. Then his mate. Then the whole car park.'}</p>
      <div class="choices"><button id="fan-sign" class="primary">✍ Sign autographs <span class="sub">+fans, +charm, costs energy</span></button><button id="fan-skip">🕶 Slip away <span class="sub">keeps energy, fans notice</span></button></div></div>`;
  }
  function bindFan() {
    const a = $('#fan-sign'), b = $('#fan-skip');
    if (a) a.onclick = () => { const p = P(); p.fans = E.clamp(p.fans + 3, 0, 100); p.charm = E.clamp(p.charm + 1, 0, 100); p.energy = Math.max(0, p.energy - 10); p.fame = E.clamp(p.fame + 1, 0, 100); U.toast = 'You sign every last one. Fans +3, Charm +1, Fame +1, Energy −10.'; render(); };
    if (b) b.onclick = () => { const p = P(); p.fans = E.clamp(p.fans - 2, 0, 100); U.toast = 'You duck into a taxi. Fans −2. Someone films it.'; render(); };
  }
  function toast() { if (!U.toast) return ''; const t = U.toast; U.toast = null; return `<div class="notice">${t}</div>`; }

  VIEWS.hub = () => {
    const p = P();
    if (S.flags.seasonEnd) return VIEWS.season();
    if (S.flags.transferWindow) return VIEWS.transfer();
    let welcome = '';
    if (U.welcome) { U.welcome = false; welcome = `<div class="card"><h3>Welcome to ${esc(club().name)}</h3><p>${esc(p.contract.promise)} Wage ${money(p.contract.wage)} a week, ${p.contract.weeksLeft} weeks on the deal. Every week: train, shop, then play. The transfer window opens every 20 weeks.</p></div>`; }
    const html = `${welcome}${toast()}<h2>${esc(club().name)} · ${esc(lg().name)}</h2>
      <p class="muted">The town is full screen. Walk into a door to go inside: your house has two floors, the Shopping Center has two floors, and the training ground, stadium tunnel and agent's office are all open. Walk up to furniture and press ENTER to use it. ☰ MENU brings you back here.${p.fame >= 50 ? ' Fans in town will run at you.' : ''}</p>
      ${fixtureCard()}
      <div class="card"><h3>Status</h3>${bar('Energy', Math.round(p.energy / E.maxEnergy(S) * 100), 'sky')}${bar('Fame', p.fame, 'gold')}${bar('Fans', p.fans)}${bar('Coach', p.coach)}${bar('Chemistry', p.chem)}${bar('Charm', p.charm, 'gold')}</div>
      ${maybeFanEncounter('hub')}
      ${pendingInternational() ? `<div class="notice">🌍 ${pendingInternational().kind === 'wc' ? 'WORLD CUP! ' + esc(p.nat) + ' need you. Four matches: two group games, a semi-final and the final.' : 'International call-up! ' + esc(p.nat) + ' friendly this week.'} Play it from the Stadium.</div>` : ''}
      ${benchedByRival() ? `<div class="notice">👀 ${esc(S.rival.name)} is in form (${S.rival.ovr}) and keeps the ${esc(p.pos)} shirt this week. Beat their form or win the coach over (60+).</div>` : ''}
      ${U.lifeNote && U.screen === 'hub' ? `<div class="notice">${U.lifeNote}</div>` : ''}${life().brandOffer ? '<div class="notice">📱 A brand wants to talk. Check your phone upstairs.</div>' : ''}
      ${p.injury > 0 ? `<div class="notice">🩹 Injured: ${p.injury} week${p.injury > 1 ? 's' : ''} left. The physio at the training ground knocks a week off.</div>` : ''}${p.banned > 0 ? '<div class="notice">🟥 Suspended for the next match.</div>' : ''}
      ${p.fame >= 50 ? '<p class="muted">Fame 50+: people recognise you in the street now. Expect crowds.</p>' : ''}`;
    const actions = [
      { label: '🗺 Walk the town', cls: 'primary', sub: 'Full-screen open world', fn: () => { U.townMenu = false; render(); } },
      { label: '🏠 Home', sub: 'Contract, garage, estate', fn: () => go('home') },
      { label: '🛍 Shopping Center', sub: 'Boots, outfits, gear', fn: () => go('shop') },
      { label: '🏃 Training Ground', sub: `${Math.floor(p.energy / E.TRAIN_COST)} sessions left`, fn: () => go('training') },
      { label: '🏟 Stadium · Match Day', cls: 'primary', sub: pendingInternational() ? 'International duty this week' : 'Play, sim or quick sim', fn: () => go('stadium') },
      { label: '📱 Phone', sub: life().status === 'single' ? 'Social, dating' : `Social · ${life().partner.name}`, fn: () => { U.lifeTab = 'social'; go('life'); } },
      { label: '👥 Squad', fn: () => go('squad') },
      { label: '📊 League Tables', fn: () => go('table') },
      { label: '📘 How to play', sub: 'Controls, charm, fame, house, shop', fn: () => { U.guideBack = 'hub'; go('guide'); } },
      { label: '📈 Career & Attributes', fn: () => go('career') },
      { label: '💾 Menu', fn: () => go('menu') },
    ];
    const after = () => {
      bindFan();
      if (U.pendingCut) { const c = U.pendingCut; U.pendingCut = null; playCut(c.type, c.data, () => render()); return; }
      if (U.townMenu || U.fan || U.forceFan || !TOWN) return;
      const host = fullscreenHost();
      U.town = TOWN.start({ host, look: p.look, kit: myKit(), acc: myAcc(false), fame: p.fame, family: familyOpts(), carIdx: D.CARS.findIndex(c => c.id === p.car), spawn: U.townPos, crowded: S.flags.fanWeek === S.week, teammates: S.teammates,
        title: `${club().name} · week ${S.week}`, sub: energySub(),
        onMenu: () => { U.townMenu = true; render(); },
        onAction: worldAction,
        onCrowd: () => { if (S.flags.fanWeek === S.week) return; S.flags.fanWeek = S.week; U.fan = { place: 'hub' }; U.toast = null; U.townPos = U.town.pos(); U.forceFan = true; render(); } });
      S.flags.tuts = S.flags.tuts || {}; if (!S.flags.tuts.town) { S.flags.tuts.town = true; setTimeout(() => U.town && U.town.note('Welcome to town. Walk with the stick or WASD, step into doors, press ENTER at anything with a label. ☰ MENU for the quick menu and the guide.', 9000), 600); }
    };
    return { html, actions, after };
  };

  VIEWS.home = () => {
    const p = P();
    const car = D.CARS.find(c => c.id === p.car), est = D.ESTATES.find(e => e.id === p.estate);
    const carRows = D.CARS.map(c => itemCard(c, { key: 'car', state: c.id === p.car ? 'cur' : p.owned.includes(c.id) ? 'owned' : 'buy', curLabel: 'Driving', useLabel: 'Drive this', effects: [`+${c.charm} charm`] })).join('');
    const estRows = D.ESTATES.map(e => itemCard(e, { key: 'est', state: e.id === p.estate ? 'cur' : p.owned.includes(e.id) ? 'owned' : 'buy', curLabel: 'Living here', useLabel: 'Move in', effects: [`+${e.charm} charm`, `+${e.energy} max energy`] })).join('');
    const html = `${toast()}<h2>🏠 Home · ${esc(est.name)}</h2>
      <div class="cards">
        <div class="card"><h3>Contract</h3><div class="kv"><span class="k">Club</span><span>${esc(p.contract.club)}</span><span class="k">League</span><span>${esc(p.contract.leagueName)}</span><span class="k">Wage</span><span>${money(p.contract.wage)} / week</span><span class="k">Remaining</span><span>${p.contract.weeksLeft} weeks</span><span class="k">Role</span><span>${esc(p.contract.role)}</span></div><p class="muted">${esc(p.contract.promise)}</p></div>
        <div class="card garage"><h3>Garage · ${esc(car.name)}</h3><pre>${esc(car.art)}</pre></div>
      </div>
      <h3 id="h-mirror">Mirror · appearance</h3>${(U.lookEd = lookEditor(p.look)).html}
      <div class="row"><span>Wallet: <span class="gold">${money(p.money)}</span></span><span class="muted">Wages land every week after the match. Win and goal bonuses on top.</span></div>
      <h3 id="h-garage">Garage</h3><div class="items">${carRows}</div>
      <h3 id="h-estate">Estate</h3><div class="items">${estRows}</div>
      ${maybeFanEncounter('home')}`;
    const after = () => {
      bindFan(); U.lookEd.bind($('#screen'));

    const cards = U.offers.map(o => `<div class="card ${o.kind === 'renewal' ? '' : 'hl'}"><h3>${o.kind === 'renewal' ? 'Contract renewal' : 'Transfer offer'} · ${esc(o.leagueName)}</h3>
      <div class="gold">${esc(o.clubName)} <span class="muted">(str ${o.str}, tier ${o.tier})</span></div>
      <div class="kv"><span class="k">Basic wage</span><span>${money(o.wage)} / wk</span><span class="k">Image rights</span><span>${money(o.imageRights)} / wk</span><span class="k">Signing bonus</span><span>${money(o.bonus)}</span><span class="k">Length</span><span>${o.weeks} weeks</span><span class="k">Squad role</span><span>${esc(o.role)}</span></div>
      <p class="muted">"${esc(o.promise)}"</p></div>`).join('');
    const html = `${toast()}<h2>📋 Transfer window · Week ${S.week}</h2>
      <p>OVR ${p.ovr}, form ${E.formAvg(p).toFixed(1)}, charm ${p.charm}. ${p.charm >= 40 ? 'Your profile is pulling bigger clubs in.' : 'More charm would tempt bigger clubs.'} ${expired ? '<span class="red">Your contract has expired: you must sign somewhere.</span>' : `${p.contract.weeksLeft} weeks left on your current deal.`}</p>
      <div class="cards">${cards}</div>`;
    const actions = U.offers.map(o => ({ label: `✍ ${o.kind === 'renewal' ? 'Renew with' : 'Join'} ${esc(o.clubName)}`, cls: 'primary', sub: `${money(o.wage + o.imageRights)}/wk · ${esc(o.role)}`, fn: () => {
      E.acceptOffer(S, o); p.contract.wage = o.wage + o.imageRights; U.offers = null; S.flags.transferWindow = false; U.welcome = o.kind !== 'renewal'; if (o.kind !== 'renewal') makeRival(); U.toast = o.kind === 'renewal' ? `New deal signed at ${esc(o.clubName)}.` : null; save();
      playCut('contract', cutData({ money: money(o.wage + o.imageRights), weeks: o.weeks, role: o.role }), () => go('hub')); } }));
    actions.push({ label: '✋ Decline all offers', cls: 'warn', disabled: expired, sub: expired ? 'Contract expired' : 'Stay on current terms', fn: () => { U.offers = null; S.flags.transferWindow = false; U.toast = 'You stay put. The agent sighs audibly.'; go('hub'); } });
    return { html, actions };
  };

  VIEWS.season = () => {
    if (!U.summary) {
      const lgName = lg().name; const awards = computeAwards({ age: P().age, apps: P().apps, goals: P().goals, assists: P().assists, motm: P().motm, finish: E.standings(lg()).findIndex(r => r.idx === S.clubIdx) + 1 });
      U.summary = E.seasonRollover(S);
      U.summary.awards = awards; U.summary.leagueName = lgName;
      S.honours = S.honours || [];
      if (U.summary.finish === 1) S.honours.push({ season: U.summary.season, name: `${lgName} champion`, club: U.summary.club });
      awards.forEach(w => { const p = P(); p.fame = E.clamp(p.fame + w.fame, 0, 100); p.fans = E.clamp(p.fans + w.fans, 0, 100); if (w.charm) p.charm = E.clamp(p.charm + w.charm, 0, 100); S.honours.push({ season: U.summary.season, name: w.name, club: U.summary.club }); });
      const cuts = [];
      if (S.highlights && S.highlights.length) cuts.push({ type: 'reel', data: cutData({ clips: S.highlights.slice(0, 5) }) });
      S.highlights = [];
      if (U.summary.finish === 1) cuts.push({ type: 'trophy', data: cutData({ league: lgName, club: U.summary.club }) });
      awards.forEach(w => cuts.push({ type: 'award', data: cutData({ kind: w.kind, club: U.summary.club, line: w.line, stats: w.stats }) }));
      U.seasonCuts = cuts; save();
    }
    const s = U.summary, p = P();
    const html = `<h2>🏁 Season ${s.season} complete</h2>
      <div class="cards"><div class="card hl"><h3>${esc(s.club)} · ${esc(s.league)}</h3><div class="kv"><span class="k">Finished</span><span class="gold">${s.finish}${ord(s.finish)}</span><span class="k">Points</span><span>${s.pts}</span></div>${s.finish === 1 ? '<span class="pill gold">🏆 Champions</span>' : ''}</div>
      <div class="card"><h3>Your season</h3><div class="kv"><span class="k">Apps</span><span>${s.apps}</span><span class="k">Goals</span><span>${s.goals}</span><span class="k">Assists</span><span>${s.assists}</span><span class="k">MOTM</span><span>${s.motm}</span><span class="k">OVR</span><span>${s.ovr}</span></div></div></div>
      ${s.awards && s.awards.length ? `<div class="card hl"><h3>Honours</h3>${s.awards.map(w => `<div>🏆 ${esc(w.name)}</div>`).join('')}</div>` : ''}
      <div class="script">${scriptLine('John', `Another year older. <b>${esc(p.name)}</b> turns ${p.age}.`)}${scriptLine('Ally', s.finish <= 3 ? 'Top-three finish. The phone will be ringing.' : s.finish >= 15 ? 'Rough season. Time to knuckle down on the training ground.' : 'Solid, unspectacular. Next year has to be the step up.')}</div>`;
    const acts = [{ label: '▶ New season', cls: 'primary', fn: () => { U.summary = null; S.flags.wcDone = false; go('hub'); } }];
    if (retirementDue()) acts.unshift({ label: '🏁 Retire', cls: 'warn', sub: `Age ${p.age}, OVR ${p.ovr}. Lap of honour and a legacy card.`, fn: () => { const L = legacyCard(); playCut('legacy', cutData({ seasons: L.seasons, clubs: L.clubs, goals: L.goals, honours: L.honours, caps: L.caps }), () => go('legacy')); } });
    return { html: html + (retirementDue() ? '<div class="notice">Your body is telling you something. Retire now, or go one more season.</div>' : '') + (s.declined ? '<p class="muted">Age has taken a little pace and power this year.</p>' : ''), actions: acts, after: () => { if (U.seasonCuts && U.seasonCuts.length) { const cuts = U.seasonCuts; U.seasonCuts = null; playCuts(cuts, () => render()); } } };
  };

  // ---------- boot ----------
  window.FC1_DEBUG = { setTimeScale: v => { U.testTimeScale = v; }, state: () => S, ui: () => U, cut: (type, extra, done) => playCut(type, cutData(extra || {}), done) };
  const sndBtn = $('#snd');
  if (sndBtn && A) sndBtn.onclick = () => { A.unlock(); A.setEnabled(!A.isEnabled()); soundBtn(); if (A.isEnabled()) A.sfx('ding'); };
  function start(hot) {
    if (hot && hot.S) { S = hot.S; U = hot.U || { screen: S.phase }; if (U.match && U.match.introduced) U.match.introduced = new Set(U.match.introduced); }
    render();
  }
  try {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      window.claude.hot.snapshot(() => ({ S, U: Object.assign({}, U, { match: U.match ? Object.assign({}, U.match, { introduced: [...(U.match.introduced || [])] }) : null }) }));
    }
  } catch (e) { /* no hot runtime */ }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body></html>
